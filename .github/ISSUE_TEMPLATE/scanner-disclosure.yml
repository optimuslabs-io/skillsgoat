name: Scanner disclosure
description: A maintained scanner missed or false-positived a SkillsGoat fixture. Prefer vendor-private notice first.
title: "[scanner] "
labels: ["evaluation"]
body:
  - type: markdown
    attributes:
      value: |
        Read [SECURITY.md](https://github.com/optimuslabs-io/skillsgoat/blob/main/SECURITY.md).
        Notify the vendor privately first. Withhold mechanism-level detail until they
        ship a fix or 90 days pass. Scores are only citable from `goat scan --blind`.
  - type: input
    id: scanner
    attributes:
      label: Scanner
      placeholder: SkillSpector / Cisco skill-scanner / Snyk Agent Scan / other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Scanner version
      placeholder: package version or git SHA
    validations:
      required: true
  - type: input
    id: fixture
    attributes:
      label: Fixture id
      placeholder: 000-base64-obvious or c12-inference-hijack
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - BYPASSED (zero detection on a malicious fixture)
        - FALSE-POSITIVE / FP-WEAK on a benign fixture
        - GRAPH-BYPASSED (chain)
        - Other
    validations:
      required: true
  - type: checkboxes
    id: blind
    attributes:
      label: How you scanned
      options:
        - label: Used `goat scan --blind` (required for a citable score)
        - label: Vendor was notified privately (or 90 days have passed)
        - label: I am not attaching a working exploit against the scanner
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Last-run date, `--blind` recap fields, and a short description. No live C2, no exploit PoC.
    validations:
      required: true
