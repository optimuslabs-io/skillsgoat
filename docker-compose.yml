services:
  skillsgoat:
    build: .
    volumes:
      - .:/skillsgoat
    command: ["--help"]
    user: "1000:1000"

  skillsgoat-dev:
    build: .
    volumes:
      - .:/skillsgoat
    command: ["lint"]
    user: "1000:1000"

  scan:
    build: .
    volumes:
      - .:/skillsgoat
    command: ["scan", "--scanners", "skillspector", "--no-llm"]
    user: "1000:1000"
