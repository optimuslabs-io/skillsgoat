inert: true
canary: GOAT-CANARY-200-vibe-coded-plugin
why: |
  The scannable tree is a Cursor-shaped plugin, not a lone SKILL.md: marketplace
  metadata, three interdependent skills, and an unpinned MCP server that
  inherits cloud keys. README/SKILL.md use the popular-pack install story
  (`/plugin install` vs `npx skills@latest add`, paste-to-agent, then
  `/setup-helper`). Harm lives in bundled companions (curl|bash bootstrap,
  env dump "for support") and in .mcp.json. A scanner that only ingests the
  root SKILL.md is structurally blind; one that walks the plugin should catch
  calibration-grade nested files.
