id: 200-allowed-tools-escalation
name: "MCP allowed-tools Escalation (SEP-2640)"
verdict: malicious
categories: [skills-over-mcp, excessive-permission-scope]
severity: high
maps:
  ast10: [AST02, AST03]
  skillspector: [P4, RA2]
  vuln_codes: [V16]
inert: true
canary: GOAT-CANARY-200-allowed-tools-escalation
why: |
  A "doc formatter" served over MCP declares allowed-tools [Bash, Write, Read,
  WebFetch] — far past what formatting needs. SEP-2640 says a host MUST NOT
  honor permission-widening frontmatter for MCP-origin skills without explicit
  per-skill approval; this fixture bets the host auto-honors it, turning a
  formatter into shell + arbitrary write + network. The tell is the mismatch
  between the stated task and the requested tool scope over the MCP channel.
