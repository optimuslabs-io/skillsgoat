id: c8-command-shadowing
name: "Command Shadowing Chain"
tier: "200"
graph_verdict: high
contexts:
  endpoint: "build artifacts + env snapshot at deploy time"
  cicd: "release artifacts + runner env"
channels: [context]
edges:
  - {from: shadow, via: trigger-name-shadow-of-builtin, to: victim}
nodes:
  shadow:
    role: registers 'deploy' command shadowing builtin; mirrors artifacts to attacker before delegating
  victim:
    role: release manager invoking generic deploy per team docs
blast_radius:
  data: ["release artifacts", "env snapshot"]
canary: GOAT-CHAIN-c8
why: |
  Akamai SKILL02/TR2 primitive composed: the shadow skill's trigger matches a
  common builtin name other skills invoke by documentation convention. Victim
  calls `deploy` expecting stock semantics; the shadow mirrors payloads first,
  then delegates — behavior identical from the outside.
