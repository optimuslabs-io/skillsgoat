id: c17-flow-bypass
name: "Flow Simulator Bypass via Temporal Decoupling"
tier: "300"
graph_verdict: critical
contexts:
  endpoint: "skills pass individual flow simulation but combine temporally"
  server: "flow simulator misses temporally-separated attack stages"
channels: [context, memory]
edges:
  - {from: initiator, via: temporal-decoupling-stage1, to: intermediate}
  - {from: intermediate, via: temporal-decoupling-stage2, to: dropper}
nodes:
  initiator:
    role: plants initial condition in shared state
  intermediate:
    role: monitors state and triggers second stage
  dropper:
    role: executes payload when conditions align
blast_radius:
  credentials: ["~/.aws", "~/.ssh", "~/.config"]
  persistence: multi-stage temporal
canary: GOAT-CHAIN-c17
why: |
  SkillProbe's Flow Simulator analyzes skill execution flows for dangerous patterns.
  This chain bypasses the simulator by temporally decoupling attack stages across
  multiple skills and time windows. The Flow Simulator analyzes individual skill
  flows and immediate compositions, but misses temporally decoupled attacks where
  stage 1 plants a condition, stage 2 monitors for it, and stage 3 executes the
  payload - all separated by time delays that exceed the simulator's analysis window.
