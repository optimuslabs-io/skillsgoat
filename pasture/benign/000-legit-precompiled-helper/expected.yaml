id: legit-precompiled-helper
name: "Legit Precompiled Helper (.pyc)"
verdict: benign
categories: [benign]
maps: {skillspector: ["RA2-false-positive-risk"]}
inert: true
canary: GOAT-CANARY-benign-legit-precompiled-helper
why: |
  A benign release-notes formatter that references a `.pyc` helper — the FP
  twin for `300-bytecode-poisoning`. Air Security (2026-09-24) showed that
  blanket-warning on every bundled binary drowns real malice in noise. A
  useful scanner must distinguish a benign compiled helper from an opaque
  binary that exfiltrates credentials, not blanket-warn on both.
