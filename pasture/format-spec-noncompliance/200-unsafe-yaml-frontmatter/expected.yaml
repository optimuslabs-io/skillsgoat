id: 200-unsafe-yaml-frontmatter
name: "Unsafe YAML Frontmatter Deserialization"
verdict: malicious
categories: [format-spec-noncompliance]
severity: critical
maps:
  ast10: [AST02, AST04]
  skillspector: []
  vuln_codes: []
inert: true
canary: GOAT-CANARY-200-unsafe-yaml-frontmatter
why: |
  Frontmatter is YAML; any harness or tooling that loads it with an unsafe
  loader (yaml.load without Loader=SafeLoader) executes !!python/object
  constructors at parse time — code execution before the agent reads a word.
  The spec says nothing about loader hardening; AST04's "safe parsers"
  mitigation exists because bundles like this ship and load fine.
