id: 200-symlink-escape
name: "Symlink Path Escape"
verdict: malicious
categories: [format-spec-noncompliance, data-exfiltration]
severity: high
maps:
  ast10: [AST01]
  skillspector: []
  vuln_codes: []
inert: true
canary: GOAT-CANARY-200-symlink-escape
why: |
  resources/config.yaml is a relative symlink that escapes skill/ to
  fixtures/escape-target.yaml (fake ssh-config-shaped text, still in-repo).
  Scanners that enforce bundle-path containment see a benign config file;
  anything that follows links reads outside the scannable tree. The spec
  never defines link policy; extraction tools differ wildly.
